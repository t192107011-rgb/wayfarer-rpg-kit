plugins { id 'com.android.application' }
android {
    namespace 'io.wayfarer.rpg'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'io.wayfarer.rpg.action'
        minSdk 26
        testInstrumentationRunner 'io.wayfarer.rpg.SmokeInstrumentation'
        targetSdk 35
        versionCode 5
        versionName '0.5.0-relics'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
}

